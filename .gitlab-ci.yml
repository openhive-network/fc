stages:
  - build
  - test

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_DEPTH: 1
  CMAKE_BUILD_TYPE: Release

default:
  image: registry.gitlab.syncad.com/hive/common-ci-configuration/ci-base-image-ubuntu:ubuntu26.04-pg18-2
  tags:
    - public-runner-docker

build:linux:
  stage: build
  script:
    - mkdir -p build && cd build
    - echo "=== Configure ===" && time cmake .. -DCMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE} -DFC_BUILD_TESTS=ON
    - echo "=== Build ===" && time make -j$(nproc)
  artifacts:
    paths:
      - build/
    expire_in: 2 hours

build:emscripten:
  stage: build
  image: registry.gitlab.syncad.com/hive/common-ci-configuration/emsdk:5.0.2-3
  script:
    - mkdir -p build-wasm && cd build-wasm
    - echo "=== Configure (Emscripten) ==="
    - time cmake ..
        -DCMAKE_TOOLCHAIN_FILE=/emsdk/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake
        -DCMAKE_BUILD_TYPE=Release
        -DHIVE_BUILD_ON_MINIMAL_FC=ON
        -DBoost_NO_WARN_NEW_VERSIONS=1
        -G Ninja
    - echo "=== Build (Emscripten) ===" && time ninja -j$(nproc)

test:
  stage: test
  needs: ["build:linux"]
  script:
    - cd build
    - echo "=== variant_test ===" && time ./tests/variant_test --log_level=test_suite
    - echo "=== sha_test ===" && time ./tests/sha_test
    - echo "=== hmac_test ===" && time ./tests/hmac_test
    - echo "=== saturation_test ===" && time ./tests/saturation_test
    - echo "=== ecdsa_canon_test ===" && time ./tests/ecdsa_canon_test
    - echo "=== ecc_test ===" && time ./tests/ecc_test testpassword /tmp/ecc_interop.dat
